[package]
name = "vespertide-macro"
version = "0.1.61"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Macro entry for runtime migration execution"
keywords = ["database", "migration", "schema", "orm", "sql"]
categories = ["database"]
readme = "../../README.md"

[lib]
proc-macro = true

[dependencies]
vespertide-core = { workspace = true }
vespertide-config = { workspace = true }
vespertide-loader = { workspace = true }
vespertide-query = { workspace = true }
vespertide-planner = { workspace = true }
syn = { version = "2.0", features = ["parsing", "proc-macro", "full"] }
proc-macro2 = "1.0"
quote = "1"
proc-macro-crate = "3.5.0"

[dev-dependencies]
tempfile = "3"
runtime-macros = "1.1"
trybuild = { version = "1.0.116", features = ["diff"] }

[lints]
workspace = true
