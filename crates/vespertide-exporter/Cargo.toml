[package]
name = "vespertide-exporter"
version = "0.1.61"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Export vespertide table definitions into ORM-specific models"
keywords = ["database", "migration", "schema", "orm", "sql"]
categories = ["database"]
readme = "../../README.md"

[dependencies]
vespertide-core = { workspace = true }
vespertide-config = { workspace = true }
vespertide-naming = { workspace = true }
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rstest = "0.26"
insta = { version = "1.47", features = ["yaml"] }
proptest = "1"

[[bench]]
name = "codegen_benchmarks"
harness = false

[lints]
workspace = true
