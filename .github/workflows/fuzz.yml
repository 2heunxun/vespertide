name: fuzz

on:
  schedule:
    - cron: '0 19 * * *'  # nightly 04:00 KST (= 19:00 UTC prior day)
  workflow_dispatch:
    inputs:
      target:
        description: 'Single fuzz target name (default: all)'
        default: 'all'
      duration_seconds:
        description: 'Per-target fuzz duration in seconds'
        default: '300'

jobs:
  fuzz:
    name: cargo-fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_model_deser
          - fuzz_sql_identifier
          - fuzz_migration_apply
          - fuzz_lsp_request
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Run cargo-fuzz (${{ matrix.target }}, 300s)
        run: |
          cd fuzz
          cargo +nightly fuzz run ${{ matrix.target }} \
            -- -max_total_time=300 -max_len=4096

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/

      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
