name: VSCode Release

on:
  push:
    tags:
      - "vscode-v*"
  workflow_dispatch:
    inputs:
      lsp_tag:
        description: "vespertide-lsp release tag to bundle (e.g. lsp-v0.1.0)"
        required: true
      vscode_tag:
        description: "VSCode extension tag to release (e.g. vscode-v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.vsce_target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vsce_target: linux-x64
            asset_name: vespertide-lsp-linux-x86_64.tar.gz
            binary_dir_name: linux-x64
            binary_ext: ""
            archive_format: tar.gz
          - vsce_target: linux-arm64
            asset_name: vespertide-lsp-linux-aarch64.tar.gz
            binary_dir_name: linux-arm64
            binary_ext: ""
            archive_format: tar.gz
          - vsce_target: darwin-x64
            asset_name: vespertide-lsp-darwin-x86_64.tar.gz
            binary_dir_name: darwin-x64
            binary_ext: ""
            archive_format: tar.gz
          - vsce_target: darwin-arm64
            asset_name: vespertide-lsp-darwin-aarch64.tar.gz
            binary_dir_name: darwin-arm64
            binary_ext: ""
            archive_format: tar.gz
          - vsce_target: win32-x64
            asset_name: vespertide-lsp-windows-x86_64.zip
            binary_dir_name: win32-x64
            binary_ext: ".exe"
            archive_format: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Determine LSP tag
        id: lsp_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.lsp_tag }}" ]; then
            echo "tag=${{ github.event.inputs.lsp_tag }}" >> "$GITHUB_OUTPUT"
          else
            # Default: latest lsp-v* tag
            LATEST=$(gh release list --limit 50 --repo dev-five-git/vespertide \
              | awk '$1 ~ /^lsp-v/ { print $1; exit }')
            if [ -z "$LATEST" ]; then
              echo "::error::No lsp-v* release found. Run lsp-release workflow first or pass --lsp-tag."
              exit 1
            fi
            echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Download LSP binary asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p apps/vscode-extension/bin/${{ matrix.binary_dir_name }}
          gh release download "${{ steps.lsp_tag.outputs.tag }}" \
            --repo dev-five-git/vespertide \
            --pattern "${{ matrix.asset_name }}" \
            --dir /tmp/lsp-asset
          ls -la /tmp/lsp-asset

      - name: Extract LSP binary (tar.gz)
        if: matrix.archive_format == 'tar.gz'
        run: |
          tar -xzf "/tmp/lsp-asset/${{ matrix.asset_name }}" -C apps/vscode-extension/bin/${{ matrix.binary_dir_name }}
          chmod +x "apps/vscode-extension/bin/${{ matrix.binary_dir_name }}/vespertide-lsp"
          ls -la apps/vscode-extension/bin/${{ matrix.binary_dir_name }}

      - name: Extract LSP binary (zip)
        if: matrix.archive_format == 'zip'
        run: |
          unzip "/tmp/lsp-asset/${{ matrix.asset_name }}" -d apps/vscode-extension/bin/${{ matrix.binary_dir_name }}
          ls -la apps/vscode-extension/bin/${{ matrix.binary_dir_name }}

      - name: Install dependencies + build
        working-directory: apps/vscode-extension
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Package VSIX
        working-directory: apps/vscode-extension
        run: |
          bunx vsce package --target ${{ matrix.vsce_target }} --no-dependencies -o vespertide-${{ matrix.vsce_target }}.vsix
          ls -la *.vsix

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.vscode_tag || github.ref_name }}
          files: apps/vscode-extension/vespertide-*.vsix
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Publish to VS Code Marketplace
        if: github.event_name == 'push'
        working-directory: apps/vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT secret not set — skipping Marketplace publish"
          else
            bunx vsce publish --packagePath vespertide-${{ matrix.vsce_target }}.vsix -p "$VSCE_PAT"
          fi

      - name: Publish to Open VSX (VSCodium/Cursor)
        if: github.event_name == 'push'
        continue-on-error: true
        working-directory: apps/vscode-extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT secret not set — skipping Open VSX publish"
          else
            bunx ovsx publish vespertide-${{ matrix.vsce_target }}.vsix -p "$OVSX_PAT"
          fi
