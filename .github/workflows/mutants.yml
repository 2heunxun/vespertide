# Action versions pinned per `.github/dependabot.yml` policy.
name: mutation-tests

on:
  pull_request:
    paths:
      - "crates/**/*.rs"
      - ".cargo/mutants.toml"

jobs:
  incremental-mutants:
    name: cargo-mutants (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Run every shard even if one finds a surviving mutant, so the full
      # picture is reported in a single CI cycle.
      fail-fast: false
      matrix:
        # cargo-mutants --shard is 0-indexed (k/n, k in 0..n). Measured
        # throughput on this repo's runners is ~22 mutants/min (~660 per
        # 30-minute job). A full refactor diff produces ~3120 changed-line
        # mutants, so >=5 shards are needed; 8 gives ~390 mutants/shard
        # (~18 min at average) with headroom for slow proptest-backed mutants
        # in vespertide-query. Empty shards on small PRs exit immediately.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: taiki-e/install-action@v2.81.6
        with:
          tool: cargo-mutants

      - name: Generate diff against PR base
        run: git diff origin/${{ github.base_ref }}.. > git.diff

      - name: Skip if no Rust changes
        run: |
          if ! grep -q '\.rs$' git.diff; then
            echo "No Rust file changes; skipping mutation tests."
            exit 0
          fi

      - name: Run cargo-mutants on changed lines (shard ${{ matrix.shard }}/8)
        run: |
          cargo mutants \
            --in-diff git.diff \
            --in-place \
            --timeout-multiplier 3.0 \
            --shard ${{ matrix.shard }}/8 \
            -vV

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-output-shard-${{ matrix.shard }}
          path: mutants.out/
