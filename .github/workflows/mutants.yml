# Action versions pinned per `.github/dependabot.yml` policy.
name: mutation-tests

on:
  pull_request:
    paths:
      - "crates/**/*.rs"
      - ".cargo/mutants.toml"

jobs:
  incremental-mutants:
    name: cargo-mutants (changed lines)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: taiki-e/install-action@v2.81.6
        with:
          tool: cargo-mutants

      - name: Generate diff against PR base
        run: git diff origin/${{ github.base_ref }}.. > git.diff

      - name: Skip if no Rust changes
        run: |
          if ! grep -q '\.rs$' git.diff; then
            echo "No Rust file changes; skipping mutation tests."
            exit 0
          fi

      - name: Run cargo-mutants on changed lines
        run: |
          cargo mutants \
            --no-shuffle \
            --in-diff git.diff \
            --in-place \
            --timeout-multiplier 3.0 \
            -vV

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-output
          path: mutants.out/
