[package]
name = "vespertide-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Required for libfuzzer-sys
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vespertide-core = { path = "../crates/vespertide-core", features = ["arbitrary"] }
vespertide-lsp = { path = "../crates/vespertide-lsp" }
vespertide-planner = { path = "../crates/vespertide-planner" }
vespertide-query = { path = "../crates/vespertide-query" }
# Used by fuzz_lsp_request to construct LSP Uris for cross-file targets.
tower-lsp-server = "=0.23.0"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "fuzz_model_deser"
path = "fuzz_targets/fuzz_model_deser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_sql_identifier"
path = "fuzz_targets/fuzz_sql_identifier.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_migration_apply"
path = "fuzz_targets/fuzz_migration_apply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_lsp_request"
path = "fuzz_targets/fuzz_lsp_request.rs"
test = false
doc = false
bench = false

[lints]
workspace = true
