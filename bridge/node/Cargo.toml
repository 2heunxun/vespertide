[package]
name = "vespertide-napi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "N-API bridge that ships the vespertide CLI to npm"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12", features = ["tokio_rt"] }
napi-derive = "3.6"
vespertide-cli = { workspace = true }

[build-dependencies]
napi-build = "2.4"

[lints]
workspace = true
